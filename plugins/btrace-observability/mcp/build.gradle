plugins {
    id 'java'
    id 'jacoco'
}

group = 'io.btrace'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.18'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.18'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.compilerArgs.addAll(['--add-modules', 'jdk.attach'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--add-modules', 'jdk.attach'
}

// End-to-end tests launch the real server through JBang against a live sample JVM. They need jbang
// on PATH and a resolvable io.btrace:btrace artifact, so they are not part of `check`.
sourceSets {
    e2eTest
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    e2eTestImplementation sourceSets.main.output
}

tasks.register('e2eTest', Test) {
    description = 'Runs the MCP server end-to-end against a sample JVM.'
    group = 'verification'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    outputs.upToDateWhen { false }
    systemProperty 'e2e.serverScript', file('src/main/java/io/btrace/mcp/BTraceMcpServer.java').absolutePath
    systemProperty 'e2e.sampleClasspath', sourceSets.e2eTest.output.classesDirs.asPath
    systemProperty 'e2e.logDir', layout.buildDirectory.dir('e2e').get().asFile.absolutePath
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
