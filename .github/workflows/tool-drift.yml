name: Tool drift

# The skills and agents of the jfr-mcp plugins name the server's tools explicitly, and the server is
# developed in btraceio/jafar. The drift this job exists to catch therefore happens when *that*
# repository changes, not when this one does, so a push-triggered job alone would never run at the
# moment it matters. The weekly schedule is the point; the push and pull_request triggers only catch
# typos and keep the script itself working.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/check-tool-references.js'
      - '.github/workflows/tool-drift.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/check-tool-references.js'
      - '.github/workflows/tool-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Skills reference tools that exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # only used to report a scheduled failure
    steps:
      - name: Check agent-plugins
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Java for JBang
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Deliberately the same install path the jfr-mcp README tells users to run, so a break in
      # that path shows up here rather than in someone's terminal.
      - name: Install the published MCP server
        id: install
        run: |
          curl -Ls https://raw.githubusercontent.com/btraceio/jafar/main/jfr-mcp/install.sh | bash
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"

      # What installs actually run. Only a change in this repository can break it.
      - name: Check every referenced tool exists on the pinned server
        id: pinned
        run: node scripts/check-tool-references.js --pinned

      # The latest release, which installs do not get until the pin moves: this is the early warning
      # that upstream moved. It still runs after a pinned failure, so one run reports both.
      - name: Check every referenced tool exists on the latest server
        id: latest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-tool-references.js

      # Nobody is watching a cron job, so an issue is how a scheduled failure reaches a human. It
      # says which check failed, because only a pinned failure means current installs are affected.
      - name: Open an issue when the scheduled run finds drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          PINNED_OUTCOME: ${{ steps.pinned.outcome }}
          LATEST_OUTCOME: ${{ steps.latest.outcome }}
        with:
          script: |
            const title = 'Tool drift check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['tool-drift'],
            });
            const causes = [];
            if (process.env.PINNED_OUTCOME === 'failure') {
              causes.push('- **Pinned release:** the release installs run fails the check, so current installs',
                '  are affected. The pin or the skills in this repository need fixing.');
            }
            if (process.env.LATEST_OUTCOME === 'failure') {
              causes.push('- **Latest release:** `jfr-mcp@btraceio` fails the check. Installs are unaffected until',
                '  the pin moves, but a tool was probably renamed or removed in btraceio/jafar.');
            }
            if (causes.length === 0) {
              causes.push('- **Neither check ran to a result:** the job failed during setup, so this says nothing',
                '  about the tools.');
            }
            const body = [
              'The weekly tool-drift run failed:',
              '',
              ...causes,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'For a failed check, the log names each missing tool with its file and line, or shows why',
              'the server did not start.',
            ].join('\n');
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['tool-drift'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            }
